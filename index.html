<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pista dos Galgos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
/* Layout: transmissão de corrida noturna — barra de placar fixa, navegação em abas, painéis azul-royal; o palco 3D é o centro de tudo. Visual escuro único, de propósito. */
:root{
  --bg:#071431; --bg2:#0b1d47; --panel:#0f2862; --panel2:#15367d; --line:#244a98; --line2:#1a3a7f;
  --ink:#f3f6ff; --mute:#9fb3e0; --dim:#6f86bd;
  --gold:#ffc83a; --gold-ink:#2a1c00; --red:#e8334c; --good:#3fdc98; --warn:#ffb44a;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14.5px;line-height:1.45;background:radial-gradient(1200px 500px at 70% -100px,#18408f 0%,transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,#0d2259,#0a1b47);border-bottom:1px solid var(--line2);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--cond);font-weight:800;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.logo .t{display:inline-grid;grid-template-columns:repeat(6,5px);gap:2px}
.logo .t b{height:20px;border-radius:1px}
.logo small{display:block;font:600 10px var(--mono);letter-spacing:.14em;color:var(--gold);margin-top:3px}
.demo{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(255,200,58,.5);border-radius:4px;padding:3px 7px}
.hstat{display:flex;gap:18px;margin-left:auto;align-items:center}
.hs{display:flex;flex-direction:column;line-height:1.1}
.hs span{font:700 10px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hs b{font:700 17px var(--mono);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--mute);font:700 15px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:9px 13px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current=true]{color:var(--ink);border-color:var(--gold)}
.tab .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
main{padding-block:22px 70px}
.eyebrow{font:700 11.5px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{margin:0;font-weight:400}
.h-serif{font-family:var(--serif);letter-spacing:.005em;line-height:1.05;text-wrap:balance}
.h-xl{font-size:clamp(34px,6vw,54px)}
.h-l{font-size:clamp(24px,3.6vw,32px)}
.h-m{font-size:21px}
.lead{color:var(--mute);max-width:64ch;margin:6px 0 0}
.sect{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sect .push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:linear-gradient(180deg,var(--panel),#0d2459);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{background:var(--panel)}
.card h3{font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.btn{font:700 13.5px var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .08s,border-color .15s,background .15s}
.btn:hover{border-color:#5d86d8}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#ffd768,var(--gold));color:var(--gold-ink);border-color:#ffd768;box-shadow:0 0 18px rgba(255,200,58,.25)}
.btn.gold:hover{background:#ffe089}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,.pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--good);border-color:rgba(63,220,152,.45)}
.chip.warn{color:var(--warn);border-color:rgba(255,180,74,.5)}
.chip.bad{color:var(--red);border-color:rgba(232,51,76,.5)}
.chip.gold{color:var(--gold);border-color:rgba(255,200,58,.5)}
.r-Comum{color:#b9c6e6}.r-Raro{color:#5fb3ff}.r-Épico{color:#c69bff}.r-Lendário{color:var(--gold)}
.grid{display:grid;gap:14px}
.g-dogs{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.dogcard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.dogcard:hover{border-color:#5d86d8;transform:translateY(-2px)}
.dc-top{display:flex;gap:12px;align-items:center}
.dc-top canvas{flex:none;background:linear-gradient(180deg,#1b3f8c,#11295f);border-radius:8px}
.dc-name{font-family:var(--serif);font-size:21px;line-height:1.1}
.dc-sub{font-size:12px;color:var(--mute)}
.dc-n{margin-left:auto;text-align:right}
.dc-n b{display:block;font:700 26px var(--mono);line-height:1}
.dc-n span{font:700 10px var(--cond);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter span{display:flex;justify-content:space-between;font:600 10.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.meter span b{font-family:var(--mono);color:var(--ink);letter-spacing:0}
.track{height:6px;background:#0a1d4b;border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:3px}
.stats{display:grid;gap:7px}
.st{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.st .v{font:700 12.5px var(--mono);color:var(--ink);text-align:right}
.bar{height:10px;border-radius:2px;background:#0a1d4b;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3d78ff,#7fb0ff)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),#0a1d4b calc(5% - 2px) 5%)}
.prof-head{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.prof-head .tiles{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:96px}
.tile span{display:block;font:700 10px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile b{font:700 20px var(--mono);font-variant-numeric:tabular-nums}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin:14px 0 16px;overflow-x:auto}
.subtabs .tab{font-size:14px;padding:8px 12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:72vh;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2a5bbd,#0b1d47);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%}
.portrait-tag{position:absolute;left:14px;bottom:12px;font:700 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13.5px}
.kv dt{font:700 10.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.kv dd{margin:0;font-weight:600}
.cond{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cond .tile b{font-size:22px}
.cond .tile small{display:block;font-size:11px;color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.nogl{display:grid;place-items:center;height:100%;color:var(--mute);font-size:13px;padding:20px;text-align:center}
/* Programa */
.raceRow{display:grid;grid-template-columns:64px minmax(0,1.6fr) repeat(3,minmax(0,.7fr)) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2)}
.raceRow:last-child{border-bottom:0}
.raceRow .hr{font:700 17px var(--mono)}
.raceRow .nm{font-family:var(--serif);font-size:18px;line-height:1.15}
.raceRow .ds{font-size:12px;color:var(--mute)}
.raceRow .k span{display:block;font:700 10px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.raceRow .k b{font:700 14px var(--mono)}
.raceRow .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.entry{background:#0b2257;border-top:1px solid var(--line2);padding:16px;display:grid;gap:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pick{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.pick[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pick b{display:block;font-family:var(--serif);font-weight:400;font-size:16px}
.pick small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.pick .fee{font:700 12px var(--mono);color:var(--gold);margin-top:6px;display:block}
label.f{display:flex;flex-direction:column;gap:5px;font:700 10.5px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
select,input{font:500 14px var(--body);background:#0a1d4b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;letter-spacing:0;text-transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
/* Ao vivo */
.racebar{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.racebar .tiles{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.livegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.ovl{position:absolute;inset:0;pointer-events:none}
.lt{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:stretch;max-width:560px;transform:translateY(0);transition:opacity .3s,transform .3s}
.lt.off{opacity:0;transform:translateY(12px)}
.lt .num{display:grid;place-items:center;width:52px;font:700 26px var(--mono);border-radius:8px 0 0 8px}
.lt .body{flex:1;background:linear-gradient(90deg,#1546b4,#0f2f86);padding:8px 14px;border-radius:0 8px 8px 0;border-top:2px solid var(--gold);min-width:0}
.lt .body small{display:block;font:700 10px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lt .body b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .body span{display:block;font-size:12px;color:#c9d6f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headline{position:absolute;left:16px;top:14px;font:800 clamp(28px,6vw,64px)/.9 var(--cond);text-transform:uppercase;color:var(--gold);text-shadow:0 3px 18px rgba(0,0,0,.55);letter-spacing:.01em;transition:opacity .4s}
.headline.off{opacity:0}
.posStrip{position:absolute;right:12px;top:12px;display:flex;gap:4px;background:rgba(7,20,49,.72);padding:5px;border-radius:8px;backdrop-filter:blur(4px)}
.posStrip .trap{width:24px;height:24px;font-size:12px}
.distLeft{position:absolute;right:12px;top:48px;font:700 12px var(--mono);background:rgba(7,20,49,.72);padding:3px 8px;border-radius:6px}
.ticker{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:10px;min-height:42px}
.ticker .eyebrow{flex:none}
.ticker p{margin:0;font-size:13.5px;min-width:0}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ctrls .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ctrls .seg button{background:var(--panel);border:0;color:var(--mute);font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:8px 11px;cursor:pointer}
.ctrls .seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink)}
.rc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rc-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line2)}
.rc-row:last-child{border-bottom:0}
.rc-row.me .rc-name{color:var(--gold)}
.rc-name{font-family:var(--serif);font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-sub{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-r{display:flex;gap:6px;align-items:center}
.odd{font:700 12px var(--mono);background:#0a1d4b;border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:52px;text-align:center}
.pos{font:700 12px var(--mono);background:var(--red);color:#fff;border-radius:6px;padding:4px 7px;min-width:34px;text-align:center}
.trap{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;font:700 13px var(--mono);flex:none}
.betbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);display:grid;gap:10px}
.res{display:grid;gap:8px}
.callout{border-left:3px solid var(--gold);padding:10px 12px;background:#0b2257;border-radius:0 8px 8px 0;font-size:13.5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
table.t th{font:700 10.5px var(--cond);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t td.n{font-family:var(--mono)}
table.t td.wrap{white-space:normal;min-width:200px}
.pos-c{color:var(--good)}.neg-c{color:var(--red)}
/* Leilão */
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.lot{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;color:var(--ink);font:inherit;text-align:left;width:100%}
.lot[aria-pressed=true]{border-color:var(--gold)}
.lot b{font-family:var(--serif);font-weight:400;font-size:17px;display:block}
.lot small{color:var(--mute);font-size:12px}
.ring{text-align:center;display:grid;gap:14px}
.bidbox{border:1px solid var(--line);border-radius:12px;padding:18px;background:#0a1d4b}
.bidbox .cur{font:700 clamp(32px,5vw,46px) var(--mono);color:var(--gold);line-height:1}
.bidbox .lead{margin:6px auto 0;font-size:13px}
.timer{height:6px;background:#0a1d4b;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--gold);transition:width .3s linear}
.bids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.blog{text-align:left;font-size:12.5px;color:var(--mute);display:grid;gap:4px;max-height:150px;overflow:auto}
/* Pacotes */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.pack{position:relative;overflow:hidden;border-radius:14px;padding:20px;border:1px solid var(--line);background:linear-gradient(150deg,#1d4fb8,#0d2459 60%);display:flex;flex-direction:column;gap:10px}
.pack.prem{background:linear-gradient(150deg,#6a4b06,#2a1d00 55%,#0d2459);border-color:#8a6a14}
.pack .ph{font:800 30px/.9 var(--cond);text-transform:uppercase}
.odds{font:500 12px var(--mono);color:var(--mute);display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.price{font:700 22px var(--mono)}
.reveal{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:scale(.85) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
/* Instalações */
.fgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#3f7a35}
.map svg{display:block;width:100%;height:auto}
.fac{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line2)}
.fac:last-child{border-bottom:0}
.fac-h{display:flex;align-items:center;gap:8px}
.fac-h b{font-family:var(--serif);font-weight:400;font-size:18px}
.lvl{display:inline-flex;gap:3px;margin-left:auto}
.lvl i{width:16px;height:6px;border-radius:2px;background:#0a1d4b;border:1px solid var(--line)}
.lvl i.on{background:var(--gold);border-color:var(--gold)}
/* Fluxo */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.rules ul{margin:0;padding-left:18px;color:var(--mute);font-size:13px;display:grid;gap:4px}
.rules b{color:var(--ink)}
.rules h4{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:18px}
.empty{color:var(--mute);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (max-width:900px){
  .pgrid,.livegrid,.lgrid,.fgrid{grid-template-columns:1fr}
  .raceRow{grid-template-columns:52px minmax(0,1fr) auto;row-gap:8px}
  .raceRow .k{display:none}
  .raceRow .acts{grid-column:1/-1;justify-content:flex-start}
  .hstat{gap:12px}
  .stage{aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){.reveal,.tab .live-dot{animation:none}.dogcard,.btn{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><span class="t"><b style="background:#d7263d"></b><b style="background:#1f6fd1"></b><b style="background:#f2f2f2"></b><b style="background:#111;outline:1px solid #555"></b><b style="background:#f28c28"></b><b style="background:repeating-linear-gradient(0deg,#111 0 4px,#f2f2f2 4px 8px)"></b></span><div>Pista dos Galgos<small>Corridas noturnas</small></div></div>
      <span class="demo">Demo · créditos sem valor</span>
      <div class="hstat">
        <div class="hs"><span>Noite</span><b id="hDay">1</b></div>
        <div class="hs"><span>Saldo</span><b id="hBal">0</b></div>
        <button class="btn sm" data-act="topup">+500 de teste</button>
      </div>
    </div>
    <nav class="tabs" id="nav" aria-label="Seções"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
"use strict";
// ================== PARÂMETROS DO DINHEIRO (o que o advogado avalia) ==================
const CFG={rakeCorrida:.10,premio1:.70,premio2:.30,rakeAposta:.10,donoVencedor:.05,taxaVenda:.05,corridasDia:2,treinosDia:2,racao:30,treino:45,fadigaMax:70};
// ================== DADOS DO MUNDO ==================
const STATS=[["vel","Velocidade"],["est","Estamina"],["for","Força"],["res","Resistência"],["lar","Largada"],["foc","Foco"]];
const RAR={Comum:{min:30,max:55},Raro:{min:42,max:68},"Épico":{min:56,max:82},"Lendário":{min:70,max:94}};
const COATS=[{n:"Preto",c:"#26211f"},{n:"Tigrado",c:"#7a5532",s:"#2b1d14"},{n:"Fulvo",c:"#c99a62"},{n:"Azul",c:"#717986"},{n:"Branco e preto",c:"#ece6dc",s:"#1e1b1a"},{n:"Vermelho",c:"#9b4a26"}];
const TRAPS=[{bg:"#d7263d",fg:"#fff"},{bg:"#1f6fd1",fg:"#fff"},{bg:"#f2f2f2",fg:"#111"},{bg:"#151515",fg:"#fff"},{bg:"#f28c28",fg:"#111"},{bg:"stripe",fg:"#d7263d"}];
const GRADES=[{g:"A1",min:72,fee:250},{g:"A2",min:64,fee:180},{g:"A3",min:57,fee:130},{g:"A4",min:50,fee:90},{g:"A5",min:43,fee:60},{g:"A6",min:0,fee:40}];
const TRACKS=["Estádio Vila Rica","Pista da Serra","Arena Litoral","Parque das Araucárias"];
const PISOS=["Rápido","Normal","Pesado"];
const N1=["Relâmpago","Faísca","Trovão","Bala","Cometa","Furacão","Sombra","Pimenta","Tufão","Flecha","Rajada","Vulto","Ventania","Brasa","Corisco","Estopim","Vendaval","Pólvora"];
const N2=["do Sul","Dourado","Negro","Veloz","de Prata","Bravo","Real","Rubro","da Serra","Ligeiro","do Vale","Noturno"];
const PLAYERS=["lobo_77","marina.bet","zeca_pista","ana_galgos","rodrigo09","kennel_br","tio_bento","juju.race","duda_fx","caio_k9","bia.trap1","nando_lebre"];
const HANDLERS=[["Seu Jorge Almeida","Veterano, ótimo na largada"],["Carla Menezes","Fase excelente, 9 vitórias no mês"],["Tonho Ribeiro","Bom com galgos novos"],["Patrícia Lemos","Especialista em pista pesada"],["Mauro Sá","Calma no box, cão concentrado"]];
const FAC={canil:{n:"Canil",fx:l=>`${2+l*2} vagas para galgos`,cost:[0,600,1500,3200],dias:[0,1,2,3]},pista:{n:"Pista de treino",fx:l=>`Treino rende +${(l-1)*8}% de progresso`,cost:[0,500,1300,2800],dias:[0,1,2,3]},clinica:{n:"Clínica veterinária",fx:l=>`Recupera ${15+l*10} de fadiga por noite`,cost:[0,550,1400,3000],dias:[0,1,2,3]},cozinha:{n:"Cozinha de ração",fx:l=>`Ração dá até +${2+l} pontos`,cost:[0,400,1100,2400],dias:[0,1,2,2]}};
const PACKS=[{id:"canil",nome:"Pacote Canil",preco:150,qtd:1,odds:{Comum:68,Raro:26,"Épico":5,"Lendário":1}},{id:"campeao",nome:"Pacote Campeão",preco:420,qtd:2,odds:{Comum:30,Raro:46,"Épico":19,"Lendário":5}}];

// ================== UTIL ==================
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString("pt-BR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
function trapBg(i){const t=TRAPS[i];return t.bg==="stripe"?"repeating-linear-gradient(0deg,#111 0 4px,#f2f2f2 4px 8px)":t.bg}
function trapEl(i){const t=TRAPS[i];return `<span class="trap" style="background:${trapBg(i)};color:${t.fg};${i===3?"box-shadow:inset 0 0 0 1px #555":""}">${i+1}</span>`}

// ================== ESTADO ==================
const KEY="pista-dos-galgos-v2";
let S;
function rollRar(odds){let r=Math.random()*100;for(const[k,v]of Object.entries(odds)){if((r-=v)<=0)return k}return"Comum"}
function makeDog(rar,owner,band){
  const r=RAR[rar],s={};STATS.forEach(([k])=>s[k]=ri(r.min,r.max));
  if(band){const n=nota({s});const shift=band-n;STATS.forEach(([k])=>s[k]=clamp(Math.round(s[k]+shift+rnd(-3,3)),20,96))}
  return{id:S?++S.uid:1,nome:pick(N1)+" "+pick(N2),rar,owner,s,sexo:pick(["Macho","Fêmea"]),idade:ri(2,4),coat:ri(0,COATS.length-1),fat:0,cond:ri(88,100),afi:ri(60,80),hoje:0,trein:0,prog:{},hist:[],vit:0,corr:0,forma:Array.from({length:3},()=>ri(1,6)).join("-")};
}
function nota(d){const s=d.s;return Math.round(s.vel*.3+s.est*.18+s.for*.1+s.res*.14+s.lar*.14+s.foc*.14)}
function valor(d){return Math.round(nota(d)**2/7)}
function grade(d){const n=nota(d);return GRADES.find(g=>n>=g.min)}
function gi(g){return GRADES.findIndex(x=>x.g===g)}
function estilo(d){return d.s.lar>d.s.est+8?"Puxador, gosta de liderar":d.s.est>d.s.lar+8?"Vem de trás no final":"Versátil"}
function distIdeal(d){return d.s.est>d.s.vel+4?525:d.s.lar>d.s.est+6?380:480}
function pisoPref(d){return d.s.for>62?"Pesado":d.s.vel>60?"Rápido":"Normal"}
function lv(k){const f=S.fac[k];return f.ate>S.dia?f.lvl-1:f.lvl}
function capacidade(){return 2+lv("canil")*2}
function status(d){if(d.fat>CFG.fadigaMax)return["bad","Precisa descansar"];if(d.hoje>=CFG.corridasDia)return["warn","Correu o limite hoje"];if(entryOf(d))return["gold","Inscrito"];return["ok","Pronto para correr"]}
function entryOf(d){return S.races.find(r=>r.status!=="fim"&&r.mine.some(m=>m.dogId===d.id))}

function fresh(){
  S={v:2,uid:1,cr:2500,dia:1,dogs:[],ledger:[],plat:{loja:0,servicos:0,corrida:0,aposta:0,mercado:0},premios:0,races:[],lots:[],auction:null,fac:{canil:{lvl:1,ate:0},pista:{lvl:1,ate:0},clinica:{lvl:1,ate:0},cozinha:{lvl:1,ate:0}},view:"canil",sel:null,ptab:"geral",lastPack:[],open:null};
  const d=makeDog("Raro","voce");d.nome="Faísca Real";S.dogs.push(d);
  genDay();genLots();
}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===2){S=j;return true}}catch(e){}return false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function genDay(){
  S.races=Array.from({length:8},(_,i)=>{const G=GRADES[[5,4,4,3,3,2,1,0][i]];const m=30+i*15;
    return{id:++S.uid,hora:`${18+Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`,pista:pick(TRACKS),dist:pick([380,480,480,525]),grade:G.g,fee:G.fee,piso:pick(PISOS),mine:[],npc:null,crowd:null,bet:null,status:"aberta",res:null}});
}
function genLots(){S.lots=Array.from({length:4},()=>{const seller=Math.random()<.5?"Criador oficial":pick(PLAYERS);const d=makeDog(rollRar({Comum:30,Raro:42,"Épico":22,"Lendário":6}),seller);return{id:++S.uid,dog:d,seller,base:Math.round(valor(d)*rnd(.55,.75)/10)*10}})}
function log(tipo,desc,v,key,pv){S.cr+=v;if(key)S.plat[key]+=pv;S.ledger.unshift({dia:S.dia,tipo,desc,v,plat:key?pv:0});if(S.ledger.length>300)S.ledger.length=300}
function spend(v,tipo,desc,key){if(S.cr<v){toast("Saldo insuficiente. Use +500 de teste.");return false}log(tipo,desc,-v,key,key?v:0);return true}

// ================== RETRATO 2D (miniaturas) ==================
function draw2D(ctx,x,y,coat,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);const c=COATS[coat];
  ctx.strokeStyle=c.c;ctx.fillStyle=c.c;ctx.lineCap="round";
  ctx.lineWidth=2.6;[[-11,3],[-8,-2],[9,-3],[12,2]].forEach(([lx,s])=>{ctx.beginPath();ctx.moveTo(lx,1);ctx.lineTo(lx+s,12);ctx.stroke()});
  ctx.beginPath();ctx.moveTo(-15,-1);ctx.quadraticCurveTo(-24,3,-28,-1);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-1,15.5,5.6,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(7,0,8,6.4,.2,0,Math.PI*2);ctx.fill();
  if(c.s){ctx.fillStyle=c.s;for(let i=-12;i<12;i+=4){ctx.fillRect(i,-5,1.6,8)}ctx.fillStyle=c.c}
  ctx.lineWidth=4.4;ctx.beginPath();ctx.moveTo(11,-3);ctx.lineTo(17,-10);ctx.stroke();
  ctx.beginPath();ctx.ellipse(20,-11,5.2,3.3,.15,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=2.8;ctx.beginPath();ctx.moveTo(23,-11);ctx.lineTo(29,-9.5);ctx.stroke();
  ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(17,-13);ctx.lineTo(14,-16);ctx.stroke();
  ctx.restore();
}
function thumbs(){document.querySelectorAll("canvas[data-thumb]").forEach(c=>{const coat=+c.dataset.thumb,w=+c.width,h=+c.height,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;c.style.width=w+"px";c.style.height=h+"px";const x=c.getContext("2d");x.scale(dpr,dpr);draw2D(x,w/2-2,h/2+5,coat,w/64)})}

// ================== MOTOR 3D ==================
const T3=window.THREE;
let REN=null,SCN=null,CAM=null,TICK=null,RAF=0,RO=null,NOGL=false;
function renderer(){
  if(REN||NOGL)return REN;
  try{REN=new T3.WebGLRenderer({antialias:true,powerPreference:"high-performance"});REN.setPixelRatio(Math.min(2,devicePixelRatio||1));REN.shadowMap.enabled=true;REN.shadowMap.type=T3.PCFSoftShadowMap;REN.outputEncoding=T3.sRGBEncoding;REN.toneMapping=T3.ACESFilmicToneMapping;REN.toneMappingExposure=1.05}
  catch(e){NOGL=true;REN=null}
  return REN;
}
function attach3D(host,build){
  stop3D();
  if(!T3||!renderer()){host.innerHTML='<div class="nogl">O 3D não está disponível neste aparelho. A simulação continua funcionando normalmente.</div>';return false}
  host.prepend(REN.domElement);
  const o=build();SCN=o.scene;CAM=o.camera;TICK=o.tick;
  const fit=()=>{const w=host.clientWidth||640,h=host.clientHeight||360;REN.setSize(w,h,false);REN.domElement.style.width="100%";REN.domElement.style.height="100%";CAM.aspect=w/h;CAM.updateProjectionMatrix()};
  fit();RO=new ResizeObserver(fit);RO.observe(host);
  let last=performance.now();
  const loop=t=>{RAF=requestAnimationFrame(loop);const dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;if(TICK)TICK(dt);REN.render(SCN,CAM)};
  RAF=requestAnimationFrame(loop);return true;
}
function stop3D(){cancelAnimationFrame(RAF);RAF=0;if(RO){RO.disconnect();RO=null}if(SCN){SCN.traverse(o=>{if(o.geometry)o.geometry.dispose();const m=o.material;if(m)(Array.isArray(m)?m:[m]).forEach(mm=>{if(mm.map)mm.map.dispose();mm.dispose()})});if(SCN.background&&SCN.background.dispose)SCN.background.dispose()}SCN=null;TICK=null}

function cvTex(w,h,draw,rep){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new T3.CanvasTexture(c);t.encoding=T3.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=T3.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
function skyTex(){return cvTex(4,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#050c26");g.addColorStop(.42,"#14306e");g.addColorStop(.62,"#3d4f8f");g.addColorStop(.74,"#d98250");g.addColorStop(.8,"#f2b46a");g.addColorStop(1,"#2a3c2a");x.fillStyle=g;x.fillRect(0,0,w,h)})}
function coatTex(coat){const c=COATS[coat];return cvTex(256,128,(x,w,h)=>{x.fillStyle=c.c;x.fillRect(0,0,w,h);if(c.n==="Tigrado"){x.strokeStyle=c.s;x.globalAlpha=.55;for(let i=0;i<46;i++){x.lineWidth=rnd(1.5,4);x.beginPath();const sx=rnd(0,w);x.moveTo(sx,0);x.bezierCurveTo(sx+rnd(-14,14),h*.3,sx+rnd(-14,14),h*.7,sx+rnd(-10,10),h);x.stroke()}}if(c.n==="Branco e preto"){x.fillStyle=c.s;for(let i=0;i<5;i++){x.beginPath();x.ellipse(rnd(0,w),rnd(0,h),rnd(20,46),rnd(16,34),rnd(0,3),0,Math.PI*2);x.fill()}}const n=x.getImageData(0,0,w,h);for(let i=0;i<n.data.length;i+=4){const k=rnd(-8,8);n.data[i]+=k;n.data[i+1]+=k;n.data[i+2]+=k}x.putImageData(n,0,0)})}
function jacketTex(i,withNum){const t=TRAPS[i];return cvTex(256,160,(x,w,h)=>{if(t.bg==="stripe"){for(let y=0;y<h;y+=20){x.fillStyle=(y/20)%2?"#f2f2f2":"#111";x.fillRect(0,y,w,20)}}else{x.fillStyle=t.bg;x.fillRect(0,0,w,h)}if(withNum){if(t.bg==="stripe"){x.fillStyle="#f2f2f2";x.beginPath();x.arc(w/2,h/2,52,0,Math.PI*2);x.fill()}x.fillStyle=t.fg;x.font="900 104px Arial Black, Arial, sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(i+1,w/2,h/2+6)}x.strokeStyle="rgba(255,255,255,.45)";x.lineWidth=6;x.strokeRect(3,3,w-6,h-6)})}

function buildDog(dog,trap){
  const g=new T3.Group(),u=g.userData;
  const tex=coatTex(dog.coat);const mat=new T3.MeshStandardMaterial({map:tex,roughness:.55,metalness:.05});
  const dark=new T3.MeshStandardMaterial({color:0x111111,roughness:.4});
  const add=(geo,m,px,py,pz,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1,parent=g)=>{const me=new T3.Mesh(geo,m);me.position.set(px,py,pz);me.rotation.set(rx,ry,rz);me.scale.set(sx,sy,sz);me.castShadow=true;parent.add(me);return me};
  const torso=new T3.Group();g.add(torso);u.torso=torso;
  add(new T3.CapsuleGeometry(.2,.62,8,16),mat,-.05,.66,0,0,0,Math.PI/2+.06,1,1,.82,torso);
  add(new T3.SphereGeometry(.27,18,14),mat,.28,.6,0,0,0,0,1.05,1.15,.78,torso);
  add(new T3.SphereGeometry(.21,16,12),mat,-.36,.68,0,0,0,0,1.1,1,.85,torso);
  add(new T3.CylinderGeometry(.085,.13,.42,12),mat,.5,.86,0,0,0,-.82,1,1,1,torso);
  const head=new T3.Group();head.position.set(.7,1.02,0);torso.add(head);u.head=head;
  add(new T3.SphereGeometry(.12,16,12),mat,0,0,0,0,0,0,1.35,.95,.9,head);
  add(new T3.ConeGeometry(.075,.3,12),mat,.24,-.03,0,0,0,-Math.PI/2,1,1,.85,head);
  add(new T3.SphereGeometry(.025,8,6),dark,.39,-.025,0,0,0,0,1,1,1,head);
  [-.06,.06].forEach(z=>{add(new T3.ConeGeometry(.045,.12,8),mat,-.08,.1,z,0,0,1.9,1,1,.6,head);add(new T3.SphereGeometry(.018,8,6),dark,.07,.03,z*1.25,0,0,0,1,1,1,head)});
  if(trap>=0){const mz=new T3.Mesh(new T3.BoxGeometry(.22,.13,.14),new T3.MeshStandardMaterial({color:0x6b5a3a,wireframe:true,transparent:true,opacity:.6}));mz.position.set(.25,-.03,0);head.add(mz)}
  const curve=new T3.CatmullRomCurve3([new T3.Vector3(-.55,.72,0),new T3.Vector3(-.82,.55,0),new T3.Vector3(-1.02,.42,0),new T3.Vector3(-1.2,.44,0)]);
  add(new T3.TubeGeometry(curve,14,.028,6,false),mat,0,0,0,0,0,0,1,1,1,torso);
  if(trap>=0){
    const side=new T3.MeshStandardMaterial({map:jacketTex(trap,true),roughness:.7});const plain=new T3.MeshStandardMaterial({map:jacketTex(trap,false),roughness:.7});
    const j=new T3.Mesh(new T3.BoxGeometry(.6,.4,.46),[plain,plain,plain,plain,side,side]);j.position.set(.0,.68,0);j.castShadow=true;torso.add(j);
  }
  u.legs=[];
  [[.3,.12,0],[.3,-.12,0],[-.38,.12,1],[-.38,-.12,1]].forEach(([x,z,back])=>{
    const hip=new T3.Group();hip.position.set(x,.64,z);g.add(hip);
    add(new T3.CylinderGeometry(back?.095:.065,.045,.34,10),mat,0,-.17,0,0,0,0,1,1,1,hip);
    const knee=new T3.Group();knee.position.y=-.34;hip.add(knee);
    add(new T3.CylinderGeometry(.04,.03,.3,8),mat,0,-.15,0,0,0,0,1,1,1,knee);
    add(new T3.SphereGeometry(.045,8,6),mat,.03,-.3,0,0,0,0,1.5,.7,1,knee);
    u.legs.push({hip,knee,back:!!back,side:z>0?0:.35});
  });
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  return g;
}
function animDog(g,p,amp,walk){
  const u=g.userData;
  u.legs.forEach(L=>{const a=p+(L.back?Math.PI:0)+L.side;
    const sw=walk?.45:.85;L.hip.rotation.z=Math.sin(a)*sw*amp;
    L.knee.rotation.z=(L.back?1:-1)*Math.max(0,Math.cos(a))*(walk?.5:1.05)*amp});
  u.torso.position.y=Math.abs(Math.sin(p))*(walk?.015:.06)*amp;
  u.torso.rotation.z=Math.sin(p*2)*.03*amp;
  u.head.rotation.z=Math.sin(p+1)*.06*amp;
}

// ----- cena do retrato -----
function buildPortrait(dog){
  const scene=new T3.Scene();
  scene.background=cvTex(4,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0c2766");g.addColorStop(.6,"#2a5fc4");g.addColorStop(1,"#0b1d47");x.fillStyle=g;x.fillRect(0,0,w,h)});
  const cam=new T3.PerspectiveCamera(32,1.6,.1,100);cam.position.set(2.1,1.15,3.7);cam.lookAt(0,.55,0);
  scene.add(new T3.HemisphereLight(0xcfe0ff,0x2b3a6a,.75));
  const key=new T3.DirectionalLight(0xffffff,1.05);key.position.set(3,6,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
  const rim=new T3.DirectionalLight(0xffc06a,.8);rim.position.set(-4,3,-3);scene.add(rim);
  const pod=new T3.Mesh(new T3.CylinderGeometry(2,2.1,.12,64),new T3.MeshStandardMaterial({color:0x7d5f3f,roughness:1}));pod.position.y=-.06;pod.receiveShadow=true;scene.add(pod);
  const ring=new T3.Mesh(new T3.TorusGeometry(2.05,.025,8,80),new T3.MeshStandardMaterial({color:0xffc83a,emissive:0x664400}));ring.rotation.x=Math.PI/2;scene.add(ring);
  const d=buildDog(dog,-1);scene.add(d);
  let p=0,ang=0;
  return{scene,camera:cam,tick:dt=>{p+=dt*4.2;ang+=dt*.22;animDog(d,p,1,true);d.position.set(Math.cos(ang*2.2)*.15,0,0);d.rotation.y=Math.sin(ang)*.9-.25}};
}

// ================== CORRIDA AO VIVO ==================
let LIVE=null;
const LANEZ=i=>-3.5+i*1.4;
function instrMods(ins){const m={start:0,drain:1,speed:1,rail:false};if(ins.lar==="Explosiva"){m.start=.06;m.drain*=1.12}if(ins.lar==="Segurar"){m.start=-.04;m.drain*=.9}if(ins.esf==="Forçar"){m.speed*=1.035;m.drain*=1.25}if(ins.esf==="Poupar"){m.speed*=.975;m.drain*=.78}if(ins.pos==="Colar na cerca"){m.speed*=1.012;m.rail=true}if(ins.pos==="Por fora"){m.speed*=.995}return m}
function prepareRace(r){
  if(!r.npc){
    const G=GRADES[gi(r.grade)];const band=G.min?G.min+ri(0,7):ri(36,44);
    r.npc=[];const free=6-r.mine.length;
    for(let i=0;i<free;i++){const d=makeDog(rollRar({Comum:40,Raro:40,"Épico":16,"Lendário":4}),pick(PLAYERS),band+ri(-4,4));r.npc.push({dog:d,handler:pick(HANDLERS)[0],ins:{lar:pick(["Explosiva","Normal","Normal","Segurar"]),esf:pick(["Normal","Normal","Forçar","Poupar"]),pos:pick(["Livre","Colar na cerca","Por fora"])}})}
    // sorteio dos boxes
    const lanes=[...Array(6).keys()].sort(()=>Math.random()-.5);let k=0;
    r.mine.forEach(m=>m.lane=lanes[k++]);r.npc.forEach(n=>n.lane=lanes[k++]);
  }
  if(!r.crowd){const L=lanesOf(r);r.crowd=Array(6).fill(0);L.forEach(l=>r.crowd[l.lane]=Math.round(rnd(60,200)*(nota(l.dog)/55)**3.2))}
}
function lanesOf(r){const out=[];r.mine.forEach(m=>{const d=S.dogs.find(x=>x.id===m.dogId);if(d)out.push({lane:m.lane,dog:d,mine:true,owner:"você",handler:m.handler,ins:m.ins})});r.npc.forEach(n=>out.push({lane:n.lane,dog:n.dog,mine:false,owner:n.dog.owner,handler:n.handler,ins:n.ins}));return out.sort((a,b)=>a.lane-b.lane)}
function pool(r){const p=r.crowd.slice();if(r.bet)p[r.bet.lane]+=r.bet.amt;return p}
function divid(r,i){const p=pool(r),t=p.reduce((a,b)=>a+b,0);return t*(1-CFG.rakeAposta-CFG.donoVencedor)/p[i]}

  // árvores ao fundo
  const tN=Math.floor((L+300)/7);const trees=new T3.InstancedMesh(new T3.ConeGeometry(2.2,7,8),new T3.MeshStandardMaterial({color:0x1d3b22,roughness:1}),tN);

function openLive(raceId){
  const r=S.races.find(x=>x.id===raceId);if(!r)return;
  prepareRace(r);S.open=r.id;S.view="live";render();
}
function initLive(){
  const r=S.races.find(x=>x.id===S.open);if(!r)return;
  const lanes=lanesOf(r);
  LIVE={r,lanes,phase:r.status==="fim"?"fim":"apresentacao",t:0,speed:1,cam:"tv",focus:0,parade:0,st:mkSt(lanes),order:[],said:{},raceT:0};
  let o=null;
  const ok=attach3D($("#stage"),()=>{o=buildRaceScene(r,lanes);LIVE.o=o;return{scene:o.scene,camera:o.cam,tick:liveTick}});
  if(!ok){LIVE.o=null;const loop=t=>{if(!LIVE||LIVE.o)return;liveTick(1/60);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
  if(LIVE.phase==="fim"&&o){o.dogs.forEach((g,i)=>{g.position.x=r.dist+20+i*1.5})}
  updateOverlay();renderCard();renderAfter();
}
function mkSt(lanes){return lanes.map(l=>({pos:0,v:0,e:100,ph:Math.random()*6,n:0,bump:0,done:false,t:0,mods:instrMods(l.ins),r50:0,r75:0}))}
function setBonus(r,lanes){lanes.forEach(l=>{const m=r.mine.find(x=>x.dogId===l.dog.id);l.handlerBonus=m?m.hb:1.01})}
function runHeadless(r){prepareRace(r);const lanes=lanesOf(r);setBonus(r,lanes);const keep=LIVE;LIVE={r,lanes,phase:"correndo",st:mkSt(lanes),order:[],said:{},raceT:0,o:null};while(LIVE.order.length<6&&LIVE.raceT<300)simStep(1/60);finishRace();LIVE=keep}
function finishInBackground(){const Lv=LIVE;if(!Lv||!(Lv.phase==="boxes"||Lv.phase==="correndo"))return;Lv.phase="correndo";Lv.o=null;while(Lv.order.length<6&&Lv.raceT<300)simStep(1/60);finishRace();const w=Lv.lanes[Lv.order[0]];toast(`Prova das ${Lv.r.hora} encerrada: ${w.dog.nome} venceu`)}
function headline(txt){const h=$("#headline");if(!h)return;if(!txt){h.classList.add("off");return}h.textContent=txt;h.classList.remove("off")}
function lowerThird(l,extra){const el=$("#lt");if(!el)return;if(!l){el.classList.add("off");return}
  el.querySelector(".num").textContent=l.lane+1;el.querySelector(".num").style.background=trapBg(l.lane);el.querySelector(".num").style.color=TRAPS[l.lane].fg;
  el.querySelector("small").textContent=extra||("Box "+(l.lane+1)+" · na apresentação");el.querySelector("b").textContent=l.dog.nome;
  el.querySelector("span").textContent=`${l.mine?"Seu galgo":"Dono: "+l.owner} · Tratador: ${l.handler} · ${l.mine?"Nota "+nota(l.dog):"Forma "+l.dog.forma}`;el.classList.remove("off")}
function say(t){const p=$("#tick");if(p)p.textContent=t}
function updateOverlay(){
  if(!LIVE)return;const{phase,r}=LIVE;
  if(phase==="apresentacao"){headline("Apresentação");say("Os galgos desfilam antes da largada. Confira o programa e faça sua aposta.")}
  if(phase==="fim"){headline("Resultado");lowerThird(null);say(r.res?r.res.comment:"")}
}
function liveTick(dt){
  const Lv=LIVE;if(!Lv)return;const o=Lv.o,r=Lv.r,L=r.dist;
  dt*=Lv.speed;Lv.t+=dt;
  if(Lv.phase==="apresentacao"){
    Lv.parade+=dt;const idx=Math.floor(Lv.parade/3.2)%6;
    if(idx!==Lv.focus||!Lv.ltShown){Lv.focus=idx;Lv.ltShown=true;lowerThird(Lv.lanes[idx])}
    if(o){o.dogs.forEach((g,i)=>{const s=Lv.st[i];s.ph+=dt*4;g.position.set(6+i*3.4+Math.sin(Lv.t*.45+i)*.7,0,2.4);g.rotation.y=Math.cos(Lv.t*.45+i)>=0?0:Math.PI;animDog(g,s.ph,.8,true)});
      const g=o.dogs[idx];if(g){const tx=g.position.x,tz=g.position.z;camTo(o.cam,tx+2.3,1.15,tz+3,tx-.1,.65,tz,dt,2.2)}}
    return;
  }
  if(Lv.phase==="boxes"){
    Lv.boxT+=dt;
    if(o){o.dogs.forEach((g,i)=>{g.position.set(-1.1,0,LANEZ(Lv.lanes[i].lane));g.rotation.y=0;animDog(g,Lv.st[i].ph+=dt*2,.2,true)});camTo(o.cam,8,2.4,9,-1,.7,0,dt,3);o.lure.position.x=-40+Lv.boxT*30}
    if(Lv.boxT>1.6&&!Lv.said.go){Lv.said.go=1;headline("Largaram!");say("Os boxes abrem e a lebre passa. Largaram!")}
    if(o&&Lv.boxT>1.6)o.doors.forEach(d=>d.rotation.z=Math.max(-1.45,d.rotation.z-dt*6));
    if(Lv.boxT>1.75){Lv.phase="correndo";Lv.raceT=0}
    return;
  }
  if(Lv.phase==="correndo"||Lv.phase==="desacelera"){
    const steps=Math.ceil(dt/(1/60));const h=dt/steps;
    for(let k=0;k<steps;k++)simStep(h);
    const lead=Math.max(...Lv.st.map(s=>s.pos));
    if(o){
      o.dogs.forEach((g,i)=>{const s=Lv.st[i];g.position.x=s.pos-1.1;const amp=clamp(s.v/22,.15,1);animDog(g,s.ph,amp,s.v<8)});
      if(o.doors)o.doors.forEach(d=>d.rotation.z=Math.max(-1.45,d.rotation.z-dt*6));
      o.lure.position.x=Math.max(o.lure.position.x+dt*12,lead+7);
      const top=[...Lv.st].sort((a,b)=>b.pos-a.pos).slice(0,3);const fx=top.reduce((a,s)=>a+s.pos,0)/3;
      o.sun.position.set(fx+20,40,25);o.sun.target.position.set(fx,0,0);
      if(Lv.cam==="tv"){if(lead>L-28&&Lv.phase==="correndo")camTo(o.cam,L+2.5,2.1,8.5,L-3,.6,0,dt,3);else camTo(o.cam,fx-4,3.6,14.5,fx+1.5,.5,-.6,dt,4)}
      else if(Lv.cam==="aerea")camTo(o.cam,fx-13,9.5,7,fx+5,0,0,dt,3);
      else camTo(o.cam,fx-9,1.6,1.2,fx+4,.6,0,dt,4);
    }
    commentary(lead);
    if(Lv.phase==="correndo"&&Lv.order.length===6){Lv.phase="desacelera";Lv.endT=0;finishRace()}
    if(Lv.phase==="desacelera"){Lv.endT+=dt;if(Lv.endT>3.5){Lv.phase="fim";updateOverlay()}}
    if(Math.floor(Lv.t*5)!==Lv.lastCard){Lv.lastCard=Math.floor(Lv.t*5);renderPositions(lead)}
    return;
  }
  if(Lv.phase==="fim"&&o){o.dogs.forEach((g,i)=>{animDog(g,Lv.st[i].ph+=dt*1.5,.12,true)});const fx=L+24;camTo(o.cam,fx-4,2.6,11,fx+4,.6,0,dt,1.5)}
}
function camTo(cam,px,py,pz,lx,ly,lz,dt,k){
  const a=1-Math.exp(-dt*k);cam.position.x+=(px-cam.position.x)*a;cam.position.y+=(py-cam.position.y)*a;cam.position.z+=(pz-cam.position.z)*a;
  cam.userData.l=cam.userData.l||new T3.Vector3(lx,ly,lz);const l=cam.userData.l;l.x+=(lx-l.x)*a;l.y+=(ly-l.y)*a;l.z+=(lz-l.z)*a;cam.lookAt(l);
}
function simStep(h){
  const Lv=LIVE,r=Lv.r,L=r.dist;Lv.raceT+=h;
  Lv.lanes.forEach((l,i)=>{const s=Lv.st[i],d=l.dog.s,m=s.mods;
    if(s.done){s.v=Math.max(0,s.v-h*7);s.pos+=s.v*h;s.ph+=h*s.v*.85;return}
    let v=17.5+d.vel*.12;
    if(s.pos<60){const f=s.pos/60;v*=.5+f*.5+(d.lar/380+m.start)*(1-f)}
    s.e-=Math.max(.05,(1.32-d.est/95-d.res/240)*m.drain)*.21*s.v*h*(480/L)**.35;
    if(s.e<45)v*=.79+Math.max(0,s.e)/215;
    v*=.86+.14*(l.dog.cond||95)/100;v*=.955+.045*(l.dog.afi||70)/100;v*=1-(l.dog.fat||0)/460;v*=m.speed;
    if(r.piso==="Pesado")v*=.985+d.for/4000;if(r.piso===pisoPref(l.dog))v*=1.012;if(distIdeal(l.dog)===L)v*=1.012;
    if(l.handlerBonus)v*=l.handlerBonus;
    if(s.pos>L*.78)v*=1+d.for/2200;
    s.n+=(Math.random()-.5)*h*2.2;s.n*=.992;v*=1+s.n*(.075-d.foc/1800);
    if(m.rail&&s.bump<=0&&Math.random()<.0012){s.bump=.9;if(!Lv.said["b"+i]){Lv.said["b"+i]=1;say(`Esbarrão na cerca! Box ${l.lane+1} perde terreno.`)}}
    if(s.bump>0){s.bump-=h;v*=.83}
    s.v+=(v-s.v)*Math.min(1,h*3.2);s.pos+=s.v*h;s.ph+=h*s.v*.85;
    if(!s.r50&&s.pos>=50)s.r50=Lv.st.filter(x=>x.pos>=50&&x!==s).length+1;
    if(!s.r75&&s.pos>=L*.75)s.r75=Lv.st.filter(x=>x.pos>=L*.75&&x!==s).length+1;
    if(s.pos>=L){s.done=true;s.t=Lv.raceT-(s.pos-L)/Math.max(1,s.v);Lv.order.push(i)}
  });
}
function commentary(lead){
  const Lv=LIVE,L=Lv.r.dist;const ord=[...Lv.st.keys()].sort((a,b)=>Lv.st[b].pos-Lv.st[a].pos);const n=i=>`${Lv.lanes[i].dog.nome} (box ${Lv.lanes[i].lane+1})`;
  if(lead>45&&!Lv.said.s){Lv.said.s=1;headline(null);say(`${n(ord[0])} sai melhor dos boxes, ${n(ord[1])} logo atrás.`)}
  if(lead>L*.5&&!Lv.said.m){Lv.said.m=1;say(`Metade da prova: ${n(ord[0])} na frente, ${n(ord[1])} em segundo e ${n(ord[2])} vem em terceiro.`)}
  if(lead>L*.78&&!Lv.said.f){Lv.said.f=1;headline("Reta final");say(`Entrando na reta final! ${n(ord[0])} segura, ${n(ord[1])} vem forte!`)}
  if(Lv.order.length&&!Lv.said.w){Lv.said.w=1;say(`${n(Lv.order[0])} vence!`)}
}
function lenStr(m){if(m<.12)return"focinho";if(m<.3)return"cabeça";if(m<.55)return"½ corpo";const q=Math.round(m/1.1*4)/4,w=Math.floor(q),f=q-w;return(w?w:"")+({0:"",.25:"¼",.5:"½",.75:"¾"}[f]||"")+(q>1?" corpos":" corpo")}
function finishRace(){
  const Lv=LIVE,r=Lv.r,lanes=Lv.lanes,ord=Lv.order;
  const times=ord.map(i=>Lv.st[i].t*1.47);
  const pot=r.fee*6,rake=pot*CFG.rakeCorrida,liq=pot-rake;S.plat.corrida+=rake;S.premios+=liq;
  const msgs=[];const w=lanes[ord[0]],s2=lanes[ord[1]];
  lanes.forEach((l,i)=>{const p=ord.indexOf(i)+1;const st=Lv.st[i];
    let c=st.r50<=2?"Largou bem":st.r50>=5?"Largada lenta":"Largada regular";
    c+=st.r75>p?", cresceu no final":st.r75<p?", cansou no fim":", manteve a posição";
    if(Lv.said["b"+i])c+=", esbarrou na cerca";
    l.dog.corr=(l.dog.corr||0)+1;if(p===1)l.dog.vit=(l.dog.vit||0)+1;
    l.dog.forma=(p+"-"+(l.dog.forma||"")).split("-").slice(0,3).join("-");
    if(l.mine){const d=l.dog;d.hoje++;d.fat=clamp(d.fat+ri(22,32)*(l.ins.esf==="Forçar"?1.25:l.ins.esf==="Poupar"?.75:1),0,100);d.afi=clamp(d.afi+(p<=3?4:2),0,100);d.cond=clamp(d.cond-ri(3,7),40,100);
      d.hist.unshift({dia:S.dia,pista:r.pista,dist:r.dist,grade:r.grade,piso:r.piso,pos:p,tempo:times[p-1].toFixed(2),coment:c});d.hist=d.hist.slice(0,30);
      if(p===1){log("Prêmio",`1º lugar · ${r.grade} ${r.dist}m · ${d.nome}`,liq*CFG.premio1);msgs.push(`${d.nome} venceu! Prêmio de <b>${fmt(liq*CFG.premio1)} CR</b>.`)}
      else if(p===2){log("Prêmio",`2º lugar · ${r.grade} ${r.dist}m · ${d.nome}`,liq*CFG.premio2);msgs.push(`${d.nome} chegou em 2º. Prêmio de <b>${fmt(liq*CFG.premio2)} CR</b>.`)}
      else msgs.push(`${d.nome} chegou em ${p}º lugar.`)}});
  const p=pool(r),tot=p.reduce((a,b)=>a+b,0),rakeA=tot*CFG.rakeAposta,dono=tot*CFG.donoVencedor,dist=tot-rakeA-dono;S.plat.aposta+=rakeA;
  if(w.mine){log("Bônus de dono","5% do pote de apostas",dono);msgs.push(`Como dono do vencedor você recebe <b>${fmt(dono)} CR</b> do pote de apostas.`)}
  if(r.bet){if(r.bet.lane===w.lane){const g=dist*r.bet.amt/p[w.lane];log("Aposta ganha",`Box ${w.lane+1} · ${r.grade} ${r.hora}`,g);msgs.push(`Aposta certa! Você recebe <b>${fmt(g)} CR</b>.`)}else msgs.push(`Sua aposta no box ${r.bet.lane+1} não acertou.`)}
  msgs.push(`A plataforma reteve ${fmt(rake)} CR das inscrições e ${fmt(rakeA)} CR do pote de apostas.`);
  r.res={order:ord.map(i=>lanes[i].lane),times:times.map(t=>t.toFixed(2)),margins:ord.map((i,k)=>k?lenStr((Lv.st[i].t-Lv.st[ord[k-1]].t)*(r.dist/Lv.st[i].t)):""),comment:`${w.dog.nome} vence em ${times[0].toFixed(2)}s, ${lenStr((Lv.st[ord[1]].t-Lv.st[ord[0]].t)*(r.dist/Lv.st[ord[1]].t))} à frente de ${s2.dog.nome}.`,msgs,dogs:lanes.map(l=>({lane:l.lane,dog:JSON.parse(JSON.stringify(l.dog)),mine:l.mine,owner:l.owner}))};
  r.status="fim";save();
  $("#hBal").textContent=fmt(S.cr);
  renderCard();renderAfter();headline(`Box ${w.lane+1} vence`);
}

function startAuction(lot){
  if(S.auction&&!S.auction.done){toast("Termine o pregão atual primeiro");return}
  const v=valor(lot.dog);const n=ri(2,4);
  S.auction={lotId:lot.id,lot,bid:lot.base,leader:null,ends:Date.now()+8000,done:false,log:[`Pregão aberto em ${fmt(lot.base)} CR`],bidders:Array.from({length:n},()=>({n:pick(PLAYERS),max:Math.round(v*rnd(.75,1.35))})).filter(b=>b.n!==lot.seller)};

setInterval(()=>{
  const a=S&&S.auction;if(!a||a.done)return;
  const now=Date.now();
  if(now>=a.ends){endAuction();return}
  if(Math.random()<.22){const cand=a.bidders.filter(b=>b.n!==a.leader&&b.max>=a.bid+Math.max(10,Math.round(a.bid*.05/10)*10));if(cand.length){const b=pick(cand);const inc=Math.max(10,Math.round(a.bid*pick([.05,.08,.1])/10)*10);a.bid=Math.min(b.max,a.bid+inc);a.leader=b.n;a.log.unshift(`${b.n} deu ${fmt(a.bid)} CR`);a.ends=Math.max(a.ends,now+4500)}}
  if(S.view==="leilao")renderRing();
},450);
function endAuction(){
  const a=S.auction;a.done=true;const lot=a.lot;

  else if(a.leader==="voce"){
    if(S.cr<a.bid){a.msg="Saldo insuficiente para pagar o lance. Lote cancelado."}
    else if(S.dogs.length>=capacidade()){a.msg="Seu canil está cheio. Amplie em Instalações. Lote cancelado."}
    else{log("Arremate no leilão",`${lot.dog.nome} de ${lot.seller}`,-a.bid,lot.seller==="Criador oficial"?"loja":"mercado",lot.seller==="Criador oficial"?a.bid:Math.round(a.bid*CFG.taxaVenda));
      if(lot.seller!=="Criador oficial")S.ledger[0].plat=Math.round(a.bid*CFG.taxaVenda);
      lot.dog.owner="voce";lot.dog.id=++S.uid;S.dogs.push(lot.dog);S.lots=S.lots.filter(l=>l.id!==lot.id);a.msg=`Arrematado! ${lot.dog.nome} é seu por ${fmt(a.bid)} CR.`}
  }else{

    else{S.lots=S.lots.filter(l=>l.id!==lot.id);a.msg=`${a.leader} arrematou por ${fmt(a.bid)} CR.`}
  }
  if(!a.leader&&lot.seller==="voce"){S.lots=S.lots.filter(l=>l.id!==lot.id);lot.dog.owner="voce";S.dogs.push(lot.dog);a.msg="Ninguém deu lance. Seu galgo voltou para o canil."}
  save();$("#hBal").textContent=fmt(S.cr)+" CR";if(S.view==="leilao")render();
}

    const preco=Math.round(valor(x.dog)*rnd(1.05,1.3)/10)*10;if(Math.random()<.35){toast(`${x.owner} recusou a oferta de ${fmt(preco)} CR`);t.disabled=true;return}
    if(!spend(preco,"Compra por oferta",`${x.dog.nome} de ${x.owner}`,null))return;const fee=Math.round(preco*CFG.taxaVenda);S.plat.mercado+=fee;S.ledger[0].plat=fee;
    const nd=JSON.parse(JSON.stringify(x.dog));nd.id=++S.uid;nd.owner="voce";nd.hoje=CFG.corridasDia;nd.hist=nd.hist||[];nd.prog=nd.prog||{};nd.trein=0;S.dogs.push(nd);x.owner="você";save();$("#hBal").textContent=fmt(S.cr)+" CR";renderAfter();toast(`Oferta aceita: ${nd.nome} é seu por ${fmt(preco)} CR`);return}
  if(ds.lot){const l=S.lots.find(x=>x.id===+ds.lot);if(l){if(S.auction&&!S.auction.done&&S.auction.lotId!==l.id){toast("Termine o pregão atual primeiro");return}if(!S.auction||S.auction.done||S.auction.lotId!==l.id)startAuction(l)}return}
  if(ds.bid){const a=S.auction;if(!a||a.done||a.out)return;const v=+ds.bid;if(S.cr<a.bid+v){toast("Saldo insuficiente para esse lance");return}a.bid+=v;a.leader="voce";a.log.unshift(`Você deu ${fmt(a.bid)} CR`);a.ends=Math.max(a.ends,Date.now()+4500);renderRing();return}
  if(ds.pack){const p=PACKS.find(x=>x.id===ds.pack);if(S.dogs.length+p.qtd>capacidade()){toast("Sem vagas no canil. Amplie em Instalações.");return}if(!spend(p.preco,"Pacote",p.nome,"loja"))return;
    const ds2=Array.from({length:p.qtd},()=>makeDog(rollRar(p.odds),"voce"));S.dogs.push(...ds2);S.lastPack=ds2.map(d=>d.id);toast(ds2.map(d=>d.rar).join(" + ")+"!");render();return}
  if(ds.up){const k=ds.up,f=S.fac[k],c=FAC[k];if(!spend(c.cost[f.lvl],"Obra",`${c.n} nível ${f.lvl+1}`,"servicos"))return;f.lvl++;f.ate=S.dia+c.dias[f.lvl-1];toast(`Obra iniciada: ${c.n}`);render();return}
  const a=ds.act;if(!a)return;
  const d=S.dogs.find(x=>x.id===+ds.id);
  if(a==="topup"){log("Recarga de teste","Créditos fictícios",500);toast("+500 CR de teste");if(LIVE){$("#hBal").textContent=fmt(S.cr)+" CR";save()}else render()}
  if(a==="novodia"){novaNoite();render()}
  if(a==="racao"&&d){if(!spend(CFG.racao,"Ração",d.nome,"loja"))return;const k=pick(STATS);const g=ri(1,1+lv("cozinha"));d.s[k[0]]=Math.min(100,d.s[k[0]]+g);d.cond=clamp(d.cond+3,0,100);toast(`${d.nome}: +${g} ${k[1]}`);render()}
  if(a==="treino"&&d){const k=ds.k;if(!spend(CFG.treino,"Treino",`${d.nome} · ${STATS.find(s=>s[0]===k)[1]}`,"servicos"))return;d.trein++;d.fat=clamp(d.fat+10,0,100);const gain=Math.round(ri(22,34)*(1+(lv("pista")-1)*.08));d.prog[k]=(d.prog[k]||0)+gain;let msg=`Progresso +${gain}%`;if(d.prog[k]>=100){d.prog[k]-=100;d.s[k]=Math.min(100,d.s[k]+3);msg=`${STATS.find(s=>s[0]===k)[1]} subiu +3!`}toast(msg);render()}
  if(a==="leiloar"&&d){if(S.auction&&!S.auction.done){toast("Termine o pregão atual primeiro");return}const lot={id:++S.uid,dog:d,seller:"voce",base:Math.round(valor(d)*.7/10)*10};S.dogs=S.dogs.filter(x=>x!==d);S.lots.unshift(lot);S.view="leilao";startAuction(lot)}
  if(a==="inscrever"){const r=S.races.find(x=>x.id===+ds.id);const dog=S.dogs.find(x=>x.id===ENTRY.dog);if(!r||!dog)return;const h=handlersFor(r)[ENTRY.handler];
    if(S.cr<r.fee+h.fee){toast("Saldo insuficiente");return}
    log("Inscrição",`${dog.nome} · ${r.grade} ${r.hora}`,-r.fee,null,0);if(h.fee)log("Tratador",`${h.n} · ${dog.nome}`,-h.fee,"servicos",h.fee);
    r.mine.push({dogId:dog.id,handler:h.n,hb:h.b,ins:{...ENTRY.ins}});ENTRY.race=null;toast(`${dog.nome} inscrito na prova das ${r.hora}`);render()}
  if(a==="largar"&&LIVE&&LIVE.phase==="apresentacao"){LIVE.phase="boxes";LIVE.boxT=0;lowerThird(null);headline("Nos boxes");say("Galgos entrando nos boxes. A lebre começa a correr...");setBonus(LIVE.r,LIVE.lanes);renderCard();t.disabled=true}
  if(a==="desistir"){const au=S.auction;if(au&&!au.done){if(au.leader==="voce"){toast("Você é o maior lance agora");return}au.out=true;au.log.unshift("Você saiu do pregão");renderRing()}}
  if(a==="fecharring"){S.auction=null;render()}
  if(a==="novoslotes"){genLots();S.auction=null;render()}
});
document.addEventListener("change",e=>{const k=e.target.dataset.ins;if(k){ENTRY.ins[k]=e.target.value}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open){e.target.click()}});

if(!load())fresh();
if(S.view==="live"&&!S.races.some(r=>r.id===S.open))S.view="programa";
if(S.auction&&!S.auction.done)S.auction.ends=Date.now()+6000;
render();
if(document.fonts)document.fonts.ready.then(()=>{if(S.view!=="live"&&S.view!=="perfil")render()});
</script>
</body>
