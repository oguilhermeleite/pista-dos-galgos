<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pista dos Galgos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: noite de pista — barra de placar fixa no topo, abas, um painel por vez; a pista de areia é o momento visual. Tema escuro único, de propósito. */
:root{
  --night:#0e1524; --panel:#162036; --panel2:#1d2a45; --line:#2b3a5c;
  --sand:#d8b886; --sand-dk:#b8955f; --ink:#eef1f7; --mute:#8d9ab8;
  --good:#4fbf7f; --bad:#e2575a; --warn:#e9b44c;
  --t1:#d7263d; --t2:#1f6fd1; --t3:#f2f2f2; --t4:#1a1a1a; --t5:#f28c28;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.logo{font-family:var(--display);font-size:20px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.logo i{display:inline-flex;gap:2px}
.logo i b{width:6px;height:18px;border-radius:2px}
.demo{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px}
.bal{margin-left:auto;display:flex;align-items:center;gap:10px}
.cr{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.cr small{color:var(--mute);font-weight:400;font-size:11px;margin-left:3px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
.tab{background:none;border:0;color:var(--mute);font:600 14px var(--body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--sand)}
main{padding-block:22px 60px}
h2{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.3px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.btn{font:600 14px var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--sand)}
.btn.pri{background:var(--sand);color:#1b1408;border-color:var(--sand)}
.btn.pri:hover{background:#e6c897}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dhead{display:flex;align-items:center;gap:10px}
.dhead canvas{flex:none}
.dname{font-weight:700;font-size:16px;line-height:1.2}
.rar{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.r-Comum{color:#a9b4cc}.r-Raro{color:#5aa7ff}.r-Épico{color:#c08bff}.r-Lendário{color:var(--warn)}
.nota{margin-left:auto;text-align:right;font-family:var(--mono)}
.nota b{display:block;font-size:22px;line-height:1}
.nota span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;gap:5px}
.st{display:grid;grid-template-columns:34px 1fr 26px;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.st .v{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:2px;background:var(--panel2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--sand)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1.5px),var(--panel) calc(5% - 1.5px) 5%)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:22px}
.pack{border-radius:14px;padding:18px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));display:flex;flex-direction:column;gap:10px}
.pack h3{font-family:var(--display);text-transform:uppercase;margin:0;font-size:19px}
.odds{font-family:var(--mono);font-size:11.5px;color:var(--mute);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.price{font-family:var(--mono);font-size:20px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
select,input{font:500 14px var(--body);background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.trackbox{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--sand-dk);background:var(--sand)}
#track{display:block;width:100%}
.lanes{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
.tablewrap{overflow-x:auto}
.lanes th{font-family:var(--mono);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.lanes td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.lanes td.n{font-family:var(--mono)}
.trap{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font:700 12px var(--mono)}
.mine{color:var(--sand);font-weight:700}
.hidden{color:var(--mute);font-family:var(--mono)}
.res{margin-top:14px;display:grid;gap:10px}
.callout{border-left:3px solid var(--sand);padding:10px 12px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-family:var(--mono);font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.rule h4{margin:0 0 6px;font-size:14px}
.rule ul{margin:0;padding-left:18px;color:var(--mute);font-size:13px;display:grid;gap:3px}
.rule b{color:var(--ink)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--night);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{color:var(--mute);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.reveal{animation:pop .45s ease both}
@keyframes pop{from{transform:scale(.92) rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.secthead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.secthead .sub{margin:0}
.secthead .btn{margin-left:auto}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><i><b style="background:var(--t1)"></b><b style="background:var(--t2)"></b><b style="background:var(--t3)"></b><b style="background:var(--t4);outline:1px solid #555"></b><b style="background:var(--t5)"></b></i>Pista dos Galgos</div>
      <span class="demo" title="Créditos fictícios, sem valor e sem saque">Demo · créditos sem valor</span>
      <div class="bal">
        <div class="cr" id="bal">0<small>CR</small></div>
        <button class="btn sm" data-act="topup" id="topup">+500 de teste</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
// ===== Configuração do fluxo de dinheiro (é isso que o advogado vai olhar) =====
const CFG = {
  inscricao: 50,          // CR por cão na corrida
  rakeCorrida: 0.10,      // plataforma fica com 10% das inscrições
  premio1: 0.70, premio2: 0.30, // divisão do restante
  rakeAposta: 0.10,       // plataforma: 10% do pote de apostas
  donoVencedor: 0.05,     // dono do cão vencedor: 5% do pote de apostas
  taxaMercado: 0.05,      // 5% sobre cada venda no mercado
  corridasPorDia: 3,
  racao: 30, treino: 60
};
const STATS = [["vel","VEL","Velocidade"],["est","EST","Estamina"],["for","FOR","Força"],["res","RES","Resistência"],["lar","LAR","Largada"],["foc","FOC","Foco"]];
const RAR = {Comum:{min:28,max:55},Raro:{min:42,max:68},"Épico":{min:56,max:82},"Lendário":{min:70,max:94}};
const PACKS = [
  {id:"basico",nome:"Pacote Canil",preco:120,qtd:1,odds:{Comum:70,Raro:25,"Épico":4.5,"Lendário":0.5}},
  {id:"premium",nome:"Pacote Campeão",preco:340,qtd:2,odds:{Comum:35,Raro:45,"Épico":16,"Lendário":4}}
];
const TRAPS = [
  {bg:"#d7263d",fg:"#fff"},{bg:"#1f6fd1",fg:"#fff"},{bg:"#f2f2f2",fg:"#111"},
  {bg:"#1a1a1a",fg:"#fff"},{bg:"#f28c28",fg:"#111"},{bg:"stripe",fg:"#d7263d"}
];
const COATS = ["#8a5a3b","#c9a27a","#3b3433","#a8a29e","#6b4423","#e5ddd0","#5a4a42"];
const N1 = ["Relâmpago","Faísca","Trovão","Bala","Cometa","Furacão","Sombra","Pimenta","Tufão","Flecha","Rajada","Vulto","Ventania","Brasa"];
const N2 = ["do Sul","Dourado","Negro","Veloz","de Prata","Bravo","Real","Rubro","da Serra","Ligeiro"];
const PLAYERS = ["lobo_77","marina.bet","zeca_pista","ana_galgos","rodrigo09","kennel_br","tio_bento","juju.race","duda_fx","caio_k9"];

let uid = 1;
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const fmt = n=>Math.round(n).toLocaleString("pt-BR");

function rollRarity(odds){let r=Math.random()*100;for(const [k,v] of Object.entries(odds)){if((r-=v)<=0)return k}return "Comum"}
function makeDog(rar,owner){
  const r=RAR[rar], s={};
  STATS.forEach(([k])=>s[k]=ri(r.min,r.max));
  return {id:uid++,nome:pick(N1)+" "+pick(N2),rar,owner,s,coat:pick(COATS),hoje:0,vit:0,corridas:0};
}
const nota = d=>Math.round(d.s.vel*.3+d.s.est*.2+d.s.for*.1+d.s.res*.15+d.s.lar*.12+d.s.foc*.13);
const valor = d=>Math.round(nota(d)**2/9);

// ===== Estado =====
const S = {cr:1500,dia:1,dogs:[],ledger:[],plat:{corrida:0,aposta:0,mercado:0,loja:0},premios:0,market:[],race:null,tab:"canil",lastPack:[]};
S.dogs.push(makeDog("Comum","voce"));
function seedMarket(){S.market=Array.from({length:6},()=>{const d=makeDog(rollRarity({Comum:40,Raro:40,"Épico":17,"Lendário":3}),pick(PLAYERS));return {dog:d,preco:Math.round(valor(d)*rnd(.9,1.3))}})}
seedMarket();

function log(tipo,desc,valorUser,platKey,platVal){
  S.cr+=valorUser;
  if(platKey){S.plat[platKey]+=platVal}
  S.ledger.unshift({dia:S.dia,tipo,desc,valor:valorUser,plat:platVal||0});
}

// ===== UI util =====
const $ = s=>document.querySelector(s);
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function trapEl(i){const t=TRAPS[i];const bg=t.bg==="stripe"?"repeating-linear-gradient(0deg,#111 0 4px,#f2f2f2 4px 8px)":t.bg;return `<span class="trap" style="background:${bg};color:${t.fg};${i===3?"outline:1px solid #555":""}">${i+1}</span>`}
function bars(d){return `<div class="stats">${STATS.map(([k,ab,full])=>`<div class="st" title="${full}"><span>${ab}</span><div class="bar"><i style="width:${d.s[k]}%"></i></div><span class="v">${d.s[k]}</span></div>`).join("")}</div>`}

function drawDog(ctx,x,y,coat,trap,num,ph,sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  const sw=Math.sin(ph)*5;
  ctx.strokeStyle=coat;ctx.lineWidth=2.4;ctx.lineCap="round";
  // pernas
  [[-11,sw],[-8,-sw],[9,-sw],[12,sw]].forEach(([lx,s])=>{ctx.beginPath();ctx.moveTo(lx,2);ctx.lineTo(lx+s,11);ctx.stroke()});
  // cauda
  ctx.beginPath();ctx.moveTo(-15,-1);ctx.quadraticCurveTo(-24,2,-27,-3+sw*.3);ctx.stroke();
  // corpo
  ctx.fillStyle=coat;ctx.beginPath();ctx.ellipse(0,-1,15,5.5,0,0,Math.PI*2);ctx.fill();
  // pescoço e cabeça
  ctx.beginPath();ctx.moveTo(11,-3);ctx.lineTo(17,-9);ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.ellipse(20,-10,5,3.2,.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(23,-10);ctx.lineTo(28,-8.5);ctx.lineWidth=2.6;ctx.stroke();
  ctx.beginPath();ctx.moveTo(17,-12);ctx.lineTo(15,-16);ctx.lineWidth=2;ctx.stroke();
  // colete
  const t=TRAPS[trap];
  if(t.bg==="stripe"){for(let i=0;i<4;i++){ctx.fillStyle=i%2?"#f2f2f2":"#111";ctx.fillRect(-8,-6.5+i*2.4,15,2.4)}}
  else{ctx.fillStyle=t.bg;ctx.fillRect(-8,-6.5,15,9.6)}
  ctx.fillStyle=t.fg;ctx.font="bold 7.5px JetBrains Mono, monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(num,-.5,-1.5);
  ctx.restore();
}
function avatar(d,trap=0){
  const c=document.createElement("canvas");const dpr=window.devicePixelRatio||1;
  c.width=64*dpr;c.height=40*dpr;c.style.width="64px";c.style.height="40px";
  const ctx=c.getContext("2d");ctx.scale(dpr,dpr);drawDog(ctx,28,24,d.coat,trap,trap+1,.6,1.1);return c;
}
function mountAvatars(){document.querySelectorAll("[data-av]").forEach(el=>{const [id,trap]=el.dataset.av.split(":");const d=findDog(+id);if(d)el.replaceWith(avatar(d,+trap||0))})}
function findDog(id){return S.dogs.find(d=>d.id===id)||S.market.map(m=>m.dog).find(d=>d.id===id)||(S.race&&S.race.lanes.map(l=>l.dog).find(d=>d.id===id))||S.lastPack.find(d=>d.id===id)}

// ===== Abas =====
const TABS=[["canil","Meu canil"],["pacotes","Pacotes"],["corrida","Corrida"],["mercado","Mercado"],["fluxo","Fluxo do dinheiro"]];
function renderTabs(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}</button>`).join("")}

function dogCard(d,acts,trap=0){
  return `<article class="dog">
    <div class="dhead"><span data-av="${d.id}:${trap}"></span><div style="min-width:0"><div class="dname">${d.nome}</div><div class="rar r-${d.rar}">${d.rar}</div></div>
    <div class="nota"><b>${nota(d)}</b><span>nota</span></div></div>
    ${bars(d)}
    ${acts}
  </article>`;
}

function vCanil(){
  const mine=S.dogs;
  return `<div class="secthead"><div><h2>Meu canil</h2><p class="sub">Seus galgos. Ração dá um ponto aleatório, treino foca no atributo que você escolher. Cada cão corre no máximo ${CFG.corridasPorDia} vezes por dia.</p></div>
  <button class="btn" data-act="novodia">Avançar dia (dia ${S.dia})</button></div>
  ${mine.length?`<div class="grid">${mine.map(d=>dogCard(d,`
    <div class="meta"><span>Corridas hoje: <b>${d.hoje}/${CFG.corridasPorDia}</b></span><span>Vitórias: <b>${d.vit}</b>/${d.corridas}</span><span>Valor estimado: <b>${fmt(valor(d))} CR</b></span></div>
    <div class="acts">
      <button class="btn sm" data-act="racao" data-id="${d.id}">Ração · ${CFG.racao}</button>
      <select data-treino="${d.id}" aria-label="Atributo do treino" id="tr-${d.id}">${STATS.map(([k,,f])=>`<option value="${k}">${f}</option>`).join("")}</select>
      <button class="btn sm" data-act="treino" data-id="${d.id}">Treinar · ${CFG.treino}</button>
      <button class="btn sm" data-act="vender" data-id="${d.id}">Vender</button>
    </div>`)).join("")}</div>`:`<div class="empty">Você ainda não tem galgos. Abra um pacote para começar.</div>`}`;
}

function vPacotes(){
  return `<h2>Pacotes</h2><p class="sub">Cada pacote sorteia galgos com raridade e atributos aleatórios. Raridade maior começa com atributos mais altos.</p>
  <div class="packs">${PACKS.map(p=>`<div class="pack"><h3>${p.nome}</h3><div class="meta">${p.qtd} galgo${p.qtd>1?"s":""} por pacote</div>
   <div class="odds">${Object.entries(p.odds).map(([k,v])=>`<span class="r-${k}">${k}</span><span>${v}%</span>`).join("")}</div>
   <div class="price">${fmt(p.preco)} CR</div><button class="btn pri" data-act="pack" data-id="${p.id}">Abrir pacote</button></div>`).join("")}</div>
  ${S.lastPack.length?`<h2 style="font-size:18px">Último pacote</h2><div class="grid" style="margin-top:10px">${S.lastPack.map(d=>`<div class="reveal">${dogCard(d,"")}</div>`).join("")}</div>`:""}`;
}

// ===== Corrida =====
function newRace(myDogId){
  const lanes=[];const base=myDogId?nota(S.dogs.find(d=>d.id===myDogId)):55;
  const myLane=myDogId?ri(0,5):-1;
  for(let i=0;i<6;i++){
    if(i===myLane){lanes.push({dog:S.dogs.find(d=>d.id===myDogId),owner:"voce",mine:true});continue}
    let d;let tries=0;do{d=makeDog(rollRarity({Comum:45,Raro:38,"Épico":14,"Lendário":3}),pick(PLAYERS));tries++}while(Math.abs(nota(d)-base)>14&&tries<40);
    lanes.push({dog:d,owner:d.owner,mine:false});
  }
  // apostas simuladas da torcida: tende a acertar um pouco quem é melhor
  const crowd=lanes.map(l=>Math.round(rnd(40,160)*(nota(l.dog)/55)**3));
  S.race={lanes,myLane,crowd,myBet:null,status:"pre",result:null,pos:null};
}
function pool(){const r=S.race;const t=r.crowd.slice();if(r.myBet)t[r.myBet.lane]+=r.myBet.amt;return t}
function oddsFor(i){const p=pool();const tot=p.reduce((a,b)=>a+b,0);return (tot*(1-CFG.rakeAposta-CFG.donoVencedor))/p[i]}

function vCorrida(){
  const r=S.race;
  const elig=S.dogs.filter(d=>d.hoje<CFG.corridasPorDia);
  let h=`<h2>Corrida</h2><p class="sub">Seis galgos, seis boxes. Antes da largada você não vê os atributos dos rivais, só o nome e o dono. Quem não tem cão pode apostar em qualquer box.</p>`;
  if(!r||r.status==="done"&&!r.result){}
  if(!r){
    h+=`<div class="panel"><div class="row">
      <label class="f" for="pick">Seu galgo (inscrição ${CFG.inscricao} CR)<select id="pick"><option value="">Só assistir e apostar</option>${elig.map(d=>`<option value="${d.id}">${d.nome} · nota ${nota(d)} · ${d.hoje}/${CFG.corridasPorDia}</option>`).join("")}</select></label>
      <button class="btn pri" data-act="montar">Montar corrida</button></div>
      ${S.dogs.length&&!elig.length?`<p class="sub" style="margin:10px 0 0">Seus galgos já correram ${CFG.corridasPorDia}x hoje. Avance o dia no canil.</p>`:""}</div>`;
    return h;
  }
  const p=pool();const tot=p.reduce((a,b)=>a+b,0);
  h+=`<div class="tablewrap"><table class="lanes"><thead><tr><th>Box</th><th>Galgo</th><th>Dono</th><th>${r.status==="done"?"Nota":"Atributos"}</th><th style="text-align:right">Pote apostas</th><th style="text-align:right">Retorno est.</th>${r.status==="done"?"<th>Chegada</th><th></th>":""}</tr></thead><tbody>
  ${r.lanes.map((l,i)=>`<tr><td>${trapEl(i)}</td><td class="${l.mine?"mine":""}">${l.dog.nome}</td><td>${l.mine?"você":l.owner}</td>
   <td class="n">${r.status==="done"||l.mine?nota(l.dog):'<span class="hidden">? ? ?</span>'}</td>
   <td class="n" style="text-align:right">${fmt(p[i])}</td><td class="n" style="text-align:right">${oddsFor(i).toFixed(2)}x</td>
   ${r.status==="done"?`<td class="n">${r.pos[i]}º</td><td>${!l.mine?`<button class="btn sm" data-act="oferta" data-lane="${i}">Fazer oferta</button>`:""}</td>`:""}</tr>`).join("")}
  </tbody></table></div>
  <div class="trackbox"><canvas id="track" height="260"></canvas></div>`;
  if(r.status==="pre"){
    h+=`<div class="panel" style="margin-top:14px"><div class="row">
      <label class="f" for="betlane">Apostar no box<select id="betlane">${r.lanes.map((l,i)=>`<option value="${i}">${i+1} · ${l.dog.nome}</option>`).join("")}</select></label>
      <label class="f" for="betamt">Valor (CR)<input id="betamt" type="number" min="10" step="10" value="50" style="width:110px"></label>
      <button class="btn" data-act="apostar">${r.myBet?"Trocar aposta":"Apostar"}</button>
      <button class="btn pri" data-act="largar" style="margin-left:auto">Largar!</button></div>
      ${r.myBet?`<p class="sub" style="margin:10px 0 0">Sua aposta: <b>${fmt(r.myBet.amt)} CR</b> no box ${r.myBet.lane+1}.</p>`:""}
      <p class="sub" style="margin:10px 0 0">Pote total de apostas: ${fmt(tot)} CR. A plataforma retém ${CFG.rakeAposta*100}%, o dono do vencedor leva ${CFG.donoVencedor*100}% e o resto vai para quem acertou.</p></div>`;
  }
  if(r.status==="done"&&r.result){
    h+=`<div class="res">${r.result.map(x=>`<div class="callout">${x}</div>`).join("")}</div>
    <h2 style="font-size:18px;margin-top:18px">Atributos revelados</h2>
    <div class="grid" style="margin-top:10px">${r.order.map(i=>dogCard(r.lanes[i].dog,`<div class="meta">${r.pos[i]}º lugar · ${r.lanes[i].mine?"seu galgo":r.lanes[i].owner}</div>`,i)).join("")}</div>
    <div style="margin-top:16px"><button class="btn pri" data-act="nova">Nova corrida</button></div>`;
  }
  return h;
}

function drawTrack(progress,phase){
  const c=$("#track");if(!c)return;const dpr=window.devicePixelRatio||1;const w=c.parentElement.clientWidth;const H=260;
  if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=H*dpr;c.style.height=H+"px"}
  const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#d8b886";ctx.fillRect(0,0,w,H);
  const lane=(H-20)/6,startX=46,endX=w-36;
  for(let i=0;i<=6;i++){ctx.strokeStyle="rgba(120,88,40,.35)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,10+i*lane);ctx.lineTo(w,10+i*lane);ctx.stroke()}
  // marcas de distância
  ctx.fillStyle="rgba(90,60,25,.55)";ctx.font="10px JetBrains Mono, monospace";
  [0.25,0.5,0.75].forEach(f=>{const x=startX+(endX-startX)*f;ctx.fillRect(x,10,1,H-20);ctx.fillText(Math.round(480*f)+"m",x+3,H-2)});
  // chegada
  for(let y=10;y<H-10;y+=6){for(let k=0;k<2;k++){ctx.fillStyle=((y/6+k)%2)?"#111":"#fff";ctx.fillRect(endX+k*6,y,6,6)}}
  // boxes
  ctx.fillStyle="#6b5233";ctx.fillRect(0,10,22,H-20);
  const r=S.race;
  r.lanes.forEach((l,i)=>{const y=10+lane*i+lane/2+3;const x=startX+(endX-startX-28)*Math.min(1,progress[i]);
    drawDog(ctx,x,y,l.dog.coat,i,i+1,phase[i],1.05);
    if(l.mine){ctx.fillStyle="#1b1408";ctx.font="bold 10px Archivo, sans-serif";ctx.fillText("VOCÊ",x-14,y-17)}});
}

function run(){
  const r=S.race;r.status="running";render();
  const dist=1000;const st=r.lanes.map(l=>({x:0,e:100,done:false,t:0,ph:Math.random()*6}));let tick=0;const fin=[];
  function step(){
    tick++;
    st.forEach((s,i)=>{if(s.done)return;const d=r.lanes[i].dog.s;
      let v=5+d.vel*.055;if(s.x<160)v+=d.lar*.03;
      s.e-=Math.max(.15,1.25-d.est/110-d.res/260);if(s.e<45)v*=.72+Math.max(0,s.e)/160;
      v*=1+(Math.random()-.5)*(.38-d.foc/340);v+=d.for*.006*(s.x>700?1:0);
      s.x+=v*.55;s.ph+=.5+v*.03;if(s.x>=dist){s.x=dist;s.done=true;fin.push(i)}});
    drawTrack(st.map(s=>s.x/dist),st.map(s=>s.ph));
    if(fin.length<6&&tick<3000)requestAnimationFrame(step);else finish(fin);
  }
  requestAnimationFrame(step);
}

function finish(order){
  const r=S.race;r.order=order;r.pos=[];order.forEach((ln,k)=>r.pos[ln]=k+1);
  const res=[];const win=order[0],sec=order[1];
  // inscrições
  const potCorrida=CFG.inscricao*6;const rake=potCorrida*CFG.rakeCorrida;const liq=potCorrida-rake;
  S.plat.corrida+=rake;S.premios+=liq;
  r.lanes.forEach((l,i)=>{l.dog.corridas++;if(i===win)l.dog.vit++});
  if(r.myLane>=0){
    const p=r.pos[r.myLane];
    if(r.myLane===win){log("Prêmio","1º lugar na corrida",liq*CFG.premio1);res.push(`Seu galgo venceu! Prêmio de <b>${fmt(liq*CFG.premio1)} CR</b>.`)}
    else if(r.myLane===sec){log("Prêmio","2º lugar na corrida",liq*CFG.premio2);res.push(`Seu galgo chegou em 2º. Prêmio de <b>${fmt(liq*CFG.premio2)} CR</b>.`)}
    else res.push(`Seu galgo chegou em ${p}º lugar.`);
  }
  // apostas
  const p=pool();const tot=p.reduce((a,b)=>a+b,0);
  const rakeA=tot*CFG.rakeAposta,dono=tot*CFG.donoVencedor,dist=tot-rakeA-dono;
  S.plat.aposta+=rakeA;
  if(r.lanes[win].mine){log("Bônus de dono","5% do pote de apostas (seu galgo venceu)",dono);res.push(`Como dono do vencedor você recebe <b>${fmt(dono)} CR</b> (${CFG.donoVencedor*100}% do pote de apostas).`)}
  if(r.myBet){
    if(r.myBet.lane===win){const g=dist*r.myBet.amt/p[win];log("Aposta ganha",`Box ${win+1}`,g);res.push(`Aposta certa! Você recebe <b>${fmt(g)} CR</b>.`)}
    else res.push(`Sua aposta no box ${r.myBet.lane+1} não acertou.`);
  }
  res.push(`Plataforma reteve ${fmt(rake)} CR das inscrições e ${fmt(rakeA)} CR das apostas.`);
  r.result=res;r.status="done";render();
  setTimeout(()=>drawTrack(r.lanes.map(()=>1),r.lanes.map(()=>.6)),30);
}

// ===== Mercado =====
function vMercado(){
  return `<div class="secthead"><div><h2>Mercado</h2><p class="sub">Galgos à venda por outros jogadores. A plataforma cobra ${CFG.taxaMercado*100}% de cada venda, de quem vende.</p></div>
  <button class="btn" data-act="refresh">Atualizar ofertas</button></div>
  <div class="grid">${S.market.map((m,k)=>dogCard(m.dog,`<div class="meta"><span>Vendedor: <b>${m.dog.owner}</b></span></div>
   <div class="acts" style="align-items:center"><span class="price" style="font-size:17px">${fmt(m.preco)} CR</span><button class="btn pri sm" style="margin-left:auto" data-act="comprar" data-k="${k}">Comprar</button></div>`)).join("")}</div>`;
}

// ===== Fluxo =====
function vFluxo(){
  const P=S.plat;const totPlat=P.corrida+P.aposta+P.mercado+P.loja;
  return `<h2>Fluxo do dinheiro</h2><p class="sub">Resumo de para onde vai cada crédito nesta demo. Os valores abaixo são os parâmetros que o advogado precisa avaliar.</p>
  <div class="kpis">
   <div class="kpi"><span>Plataforma · total</span><b>${fmt(totPlat)}</b></div>
   <div class="kpi"><span>Loja (pacotes, ração, treino)</span><b>${fmt(P.loja)}</b></div>
   <div class="kpi"><span>Taxa de corridas</span><b>${fmt(P.corrida)}</b></div>
   <div class="kpi"><span>Taxa de apostas</span><b>${fmt(P.aposta)}</b></div>
   <div class="kpi"><span>Taxa do mercado</span><b>${fmt(P.mercado)}</b></div>
   <div class="kpi"><span>Prêmios de corrida pagos</span><b>${fmt(S.premios)}</b></div>
  </div>
  <div class="rules">
   <div class="panel rule"><h4>Compras na loja</h4><ul><li>Pacotes, ração e treino: <b>100% para a plataforma</b></li><li>Galgos têm raridade sorteada (ver odds na aba Pacotes)</li></ul></div>
   <div class="panel rule"><h4>Corrida (inscrições)</h4><ul><li>Inscrição: <b>${CFG.inscricao} CR</b> por galgo, 6 por corrida</li><li>Plataforma: <b>${CFG.rakeCorrida*100}%</b></li><li>1º lugar: <b>${CFG.premio1*100}%</b> do restante · 2º: <b>${CFG.premio2*100}%</b></li><li>Máximo de ${CFG.corridasPorDia} corridas por galgo por dia</li></ul></div>
   <div class="panel rule"><h4>Apostas de espectadores</h4><ul><li>Modelo de pote (apostas mútuas)</li><li>Plataforma: <b>${CFG.rakeAposta*100}%</b> · dono do vencedor: <b>${CFG.donoVencedor*100}%</b></li><li>Restante dividido entre quem apostou no vencedor</li></ul></div>
   <div class="panel rule"><h4>Mercado</h4><ul><li>Preço livre entre jogadores</li><li>Plataforma: <b>${CFG.taxaMercado*100}%</b> de cada venda, pago por quem vende</li><li>Oferta pelo vencedor ao final de cada corrida</li></ul></div>
  </div>
  <div class="callout" style="margin-bottom:16px">Carteira real (depósito e saque em USDT ou Pix) <b>não existe nesta demo</b>. Os créditos são fictícios e não podem ser sacados. Essa integração só entra depois da análise jurídica.</div>
  <h2 style="font-size:18px">Extrato da sessão</h2>
  ${S.ledger.length?`<div class="tablewrap"><table class="lanes"><thead><tr><th>Dia</th><th>Tipo</th><th>Descrição</th><th style="text-align:right">Você</th><th style="text-align:right">Plataforma</th></tr></thead><tbody>
  ${S.ledger.slice(0,80).map(e=>`<tr><td class="n">${e.dia}</td><td>${e.tipo}</td><td>${e.desc}</td><td class="n ${e.valor>=0?"pos":"neg"}" style="text-align:right">${e.valor>=0?"+":""}${fmt(e.valor)}</td><td class="n" style="text-align:right">${e.plat?"+"+fmt(e.plat):"—"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhuma movimentação ainda. Abra um pacote ou dispute uma corrida.</div>`}`;
}

// ===== Render =====
function render(){
  $("#bal").innerHTML=fmt(S.cr)+"<small>CR</small>";renderTabs();
  const v={canil:vCanil,pacotes:vPacotes,corrida:vCorrida,mercado:vMercado,fluxo:vFluxo}[S.tab]();
  $("#main").innerHTML=v;mountAvatars();
  if(S.tab==="corrida"&&S.race&&S.race.status!=="running"){const done=S.race.status==="done";drawTrack(S.race.lanes.map(()=>done?1:0),S.race.lanes.map((_,i)=>i))}
}
function spend(v,tipo,desc,key){if(S.cr<v){toast("Créditos insuficientes. Use +500 de teste.");return false}log(tipo,desc,-v,key,v);return true}

document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");if(tab){if(S.race&&S.race.status==="running")return;S.tab=tab.dataset.tab;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;const id=+b.dataset.id;
  const d=S.dogs.find(x=>x.id===id);
  if(a==="topup"){log("Recarga de teste","Créditos fictícios",500);toast("+500 CR de teste");render()}
  if(a==="pack"){const p=PACKS.find(x=>x.id===b.dataset.id);if(!spend(p.preco,"Pacote",p.nome,"loja"))return;
    S.lastPack=Array.from({length:p.qtd},()=>makeDog(rollRarity(p.odds),"voce"));S.dogs.push(...S.lastPack);toast(S.lastPack.map(x=>x.rar).join(" + ")+"!");render()}
  if(a==="racao"){if(!spend(CFG.racao,"Ração",d.nome,"loja"))return;const k=pick(STATS)[0];const g=ri(1,3);d.s[k]=Math.min(100,d.s[k]+g);toast(`${d.nome}: +${g} ${STATS.find(s=>s[0]===k)[2]}`);render()}
  if(a==="treino"){const k=$("#tr-"+id).value;if(!spend(CFG.treino,"Treino",d.nome,"loja"))return;const g=ri(2,4);d.s[k]=Math.min(100,d.s[k]+g);toast(`${d.nome}: +${g} ${STATS.find(s=>s[0]===k)[2]}`);render()}
  if(a==="vender"){const preco=Math.round(valor(d)*rnd(.95,1.15));const fee=Math.round(preco*CFG.taxaMercado);
    S.dogs=S.dogs.filter(x=>x!==d);log("Venda no mercado",`${d.nome} para ${pick(PLAYERS)}`,preco-fee,"mercado",fee);toast(`Vendido por ${fmt(preco)} CR (taxa ${fmt(fee)})`);render()}
  if(a==="novodia"){S.dia++;S.dogs.forEach(x=>x.hoje=0);toast(`Dia ${S.dia}: corridas liberadas`);render()}
  if(a==="montar"){const v=+$("#pick").value||0;if(v){const dd=S.dogs.find(x=>x.id===v);if(!spend(CFG.inscricao,"Inscrição",dd.nome,null))return;S.ledger[0].plat=0;dd.hoje++}newRace(v);render()}
  if(a==="apostar"){const r=S.race;const lane=+$("#betlane").value;const amt=Math.round(+$("#betamt").value||0);if(amt<10){toast("Aposta mínima: 10 CR");return}
    if(r.myBet){log("Aposta cancelada",`Box ${r.myBet.lane+1}`,r.myBet.amt)}
    if(!spend(amt,"Aposta",`Box ${lane+1} · ${r.lanes[lane].dog.nome}`,null))return;S.ledger[0].plat=0;r.myBet={lane,amt};render()}
  if(a==="largar")run();
  if(a==="nova"){S.race=null;render()}
  if(a==="oferta"){const l=S.race.lanes[+b.dataset.lane];const preco=Math.round(valor(l.dog)*rnd(1.05,1.3));
    if(Math.random()<.35){toast(`${l.owner} recusou a oferta`);b.disabled=true;return}
    if(!spend(preco,"Compra (oferta)",`${l.dog.nome} de ${l.owner}`,null))return;
    const fee=Math.round(preco*CFG.taxaMercado);S.plat.mercado+=fee;S.ledger[0].plat=fee;
    l.dog.owner="voce";l.dog.hoje=CFG.corridasPorDia;S.dogs.push(l.dog);l.mine=true;toast(`Oferta aceita: ${l.dog.nome} é seu (${fmt(preco)} CR)`);render()}
  if(a==="comprar"){const m=S.market[+b.dataset.k];if(!spend(m.preco,"Compra no mercado",`${m.dog.nome} de ${m.dog.owner}`,null))return;
    const fee=Math.round(m.preco*CFG.taxaMercado);S.plat.mercado+=fee;S.ledger[0].plat=fee;m.dog.owner="voce";S.dogs.push(m.dog);S.market.splice(+b.dataset.k,1);toast(`${m.dog.nome} agora é seu`);render()}
  if(a==="refresh"){seedMarket();render()}
});
window.addEventListener("resize",()=>{if(S.tab==="corrida"&&S.race&&S.race.status!=="running"){const done=S.race.status==="done";drawTrack(S.race.lanes.map(()=>done?1:0),S.race.lanes.map((_,i)=>i))}});
document.fonts&&document.fonts.ready.then(render);
render();
</script>
